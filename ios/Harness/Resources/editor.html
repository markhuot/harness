<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The file viewer's editor page (editor/src/bridge.ts through the app's EditorWebHost). The theme
     arrives as CSS variables from the host; these are only the colors of the first paint. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin: 0; height: 100%; background: transparent; -webkit-text-size-adjust: 100%; }
  body { overflow: hidden; -webkit-touch-callout: none; }
  /* The page scrolls, not an inner scroller: UIKit then sees the web view's own scroll view, so a
     sheet drags down from the top of the file and the keyboard insets it natively. */
  html, body { height: auto; min-height: 100%; }
  body { overflow: visible; }
  /* The editor draws the file only where it shows (the virtualizer reads the page's scroll), and the
     code scrolls sideways inside its own lines. */
  diffs-container { display: block; }
</style>
</head>
<body>
<script src="editor.js"></script>
<script>
  HarnessEditor.mount(window, function (event) {
    window.webkit.messageHandlers.editor.postMessage(JSON.stringify(event));
  });
</script>
</body>
</html>
