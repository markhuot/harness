# XcodeGen spec for the native iPhone/iPad app. `cd ios && xcodegen` writes Harness.xcodeproj
# (gitignored, always regenerated). Sources are folder-globbed: add files under Harness/
# and they're in the target, no edits here needed. Portable logic lives in the HarnessKit package.
name: Harness
options:
  bundleIdPrefix: com.markhuot
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 47P4ZSALX4
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  HarnessKit:
    path: HarnessKit
targets:
  Harness:
    type: application
    platform: iOS
    sources:
      - path: Harness
    dependencies:
      - package: HarnessKit
        product: HarnessKit
      - package: HarnessKit
        product: HarnessHighlight
      # The home screen widgets (ios/Widgets, ARCHITECTURE.md § Widgets), embedded in PlugIns.
      - target: HarnessWidgets
    # The App Group the app shares with its widgets (WidgetShared): the active server and the last
    # snapshot.
    entitlements:
      path: Harness/Harness.entitlements
    # The syntax highlighter's JavaScriptCore bundle (Shiki, from Tools/highlighter/highlight.ts) is
    # generated, not committed: bun bundles it into the app on every build (ARCHITECTURE.md
    # § Syntax highlighting). It runs every time because its inputs are the whole Shiki dependency
    # tree; build-highlighter.ts leaves the file alone when nothing changed.
    preBuildScripts:
      - name: Bundle highlighter
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          BUN="$(command -v bun || true)"
          for c in "$HOME/.bun/bin/bun" /opt/homebrew/bin/bun /usr/local/bin/bun; do
            if [ -z "$BUN" ] && [ -x "$c" ]; then BUN="$c"; fi
          done
          if [ -z "$BUN" ]; then
            echo "error: bun (https://bun.sh) is needed to bundle the syntax highlighter. Install it, then run bun install at the repo root."
            exit 1
          fi
          "$BUN" "$SRCROOT/Tools/build-highlighter.ts" --out "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/highlighter.js"
    info:
      path: Harness/Info.plist
      properties:
        CFBundleDisplayName: Harness
        CFBundleName: Harness
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [harness]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # Only NSAllowsArbitraryLoads: iOS ignores it when NSAllowsLocalNetworking or the
        # ...InWebContent / ...ForMedia keys are present, which breaks http to a Tailscale 100.x
        # address (ios/Tools/config.test.ts guards this).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Harness connects to the harness service running on your Mac over your local network or Tailscale.
        NSCameraUsageDescription: Harness uses the camera to scan the pairing QR code shown in the desktop app.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: SplashIcon
          UIImageRespectsSafeAreaInsets: true
        # Several windows on iPad: main windows and ticket windows (HarnessApp's two WindowGroups).
        # Each window has its own Router; AppModel, the store, toasts and Actions are shared
        # (ARCHITECTURE.md § App shell, Windows). iPhone keeps one window regardless.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # The activity WindowDirectory.openTicket's scene activation request carries to open a ticket
        # in its prominent window, which also brings the ticket back on relaunch
        # (TicketWindowValue.activityType); iPadOS opens only listed types as new windows.
        NSUserActivityTypes:
          - com.markhuot.harness.ticket
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # "Bundle highlighter" reads node_modules and the TS sources, which a sandboxed script
        # phase may only do for declared inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.markhuot.harness
  # The widgets (ARCHITECTURE.md § Widgets). One set of sources builds both extensions: this one
  # for iPhone and iPad, embedded in the app, and HarnessMacWidgets for the Electron Mac app.
  HarnessWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Sources
    dependencies:
      - package: HarnessKit
        product: HarnessKit
    entitlements:
      path: Widgets/iOS/HarnessWidgets.entitlements
    info:
      path: Widgets/iOS/Info.plist
      properties:
        CFBundleDisplayName: Harness
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # The same as the app: plain http to the Mac over the LAN or Tailscale.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.markhuot.harness.widgets
        SKIP_INSTALL: YES
  # Built by app/scripts/package.ts (xcodebuild -scheme HarnessMacWidgets) and copied into
  # Harness.app/Contents/PlugIns; sign-mac.ts signs it with its own sandbox entitlements.
  HarnessMacWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Widgets/Sources
    dependencies:
      - package: HarnessKit
        product: HarnessKit
    entitlements:
      path: Widgets/macOS/HarnessMacWidgets.entitlements
    info:
      path: Widgets/macOS/Info.plist
      properties:
        CFBundleDisplayName: Harness
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        # Inside the Electron app's bundle id (APP_BUNDLE_ID in app/scripts/package.ts).
        PRODUCT_BUNDLE_IDENTIFIER: com.markhuot.harness.app.widgets
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
schemes:
  Harness:
    build:
      targets:
        Harness: all
    run:
      config: Debug
    archive:
      config: Release
  HarnessMacWidgets:
    build:
      targets:
        HarnessMacWidgets: all
