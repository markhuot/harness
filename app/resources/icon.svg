<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f7be0"/>
      <stop offset="1" stop-color="#4450b8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ebfb"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px squircle-ish tile centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- three kanban columns of cards -->
  <g fill="url(#card)">
    <rect x="232" y="262" width="160" height="120" rx="26"/>
    <rect x="232" y="402" width="160" height="200" rx="26" opacity="0.9"/>
    <rect x="432" y="262" width="160" height="240" rx="26"/>
    <rect x="632" y="262" width="160" height="90" rx="26" opacity="0.9"/>
    <rect x="632" y="372" width="160" height="150" rx="26"/>
  </g>
  <!-- harness "run" bar -->
  <rect x="232" y="662" width="560" height="96" rx="48" fill="#1b1f4d" opacity="0.35"/>
  <rect x="232" y="662" width="360" height="96" rx="48" fill="#ffffff"/>
  <circle cx="544" cy="710" r="22" fill="#5e6ad2"/>
</svg>
